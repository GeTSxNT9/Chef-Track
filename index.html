<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GastroOS">
    <meta name="theme-color" content="#F5F5F7">
    <title>GastroOS - Motor de Menús</title>
    
    <!-- CARGA EXCLUSIVA DEL RECETARIO DESACOPLADO -->
    <script src="recipes.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Sistema de diseño adaptado Apple HIG */
        :root {
            color-scheme: light;
            --g-bg: #f5f5f7;
            --g-surface: rgba(255,255,255,.82);
            --g-border: rgba(15,23,42,.08);
            --g-text: #0f172a;
            --g-muted: #64748b;
            --g-accent: #0071e3;
            --g-shadow-sm: 0 4px 18px rgba(15,23,42,.045);
        }
        html.dark {
            color-scheme: dark;
            --g-bg: #0b0b0d;
            --g-surface: rgba(28,28,30,.82);
            --g-border: rgba(255,255,255,.09);
            --g-text: #f5f5f7;
            --g-muted: #a1a1aa;
            --g-accent: #2997ff;
        }
        body {
            background: var(--g-bg) !important;
            color: var(--g-text) !important;
            letter-spacing: -.006em;
        }
        header {
            height: 60px;
            background: rgba(255,255,255,.72);
            backdrop-filter: blur(22px) saturate(180%);
            border-bottom: 1px solid var(--g-border);
        }
        html.dark header { background: rgba(28,28,30,.72); }
        main section, .glass-card {
            background: var(--g-surface);
            border: 1px solid var(--g-border);
            box-shadow: var(--g-shadow-sm);
            backdrop-filter: blur(18px) saturate(150%);
            border-radius: 20px;
        }
        .nav-btn.active { color: var(--g-accent) !important; }
        
        .gastro-slot {
            background: rgba(248,250,252,.72);
            border: 1px solid rgba(15,23,42,.065);
            border-radius: 16px;
            min-height: 66px;
        }
        html.dark .gastro-slot { background: rgba(39,39,42,.6); border-color: rgba(255,255,255,.05); }
        
        body > nav {
            height: 72px;
            background: rgba(255,255,255,.76);
            backdrop-filter: blur(24px) saturate(180%);
            border-top: 1px solid var(--g-border);
            padding-bottom: max(env(safe-area-inset-bottom), 4px);
        }
        html.dark body > nav { background: rgba(28,28,30,.78); }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden transition-colors">

    <header class="sticky top-0 z-40 flex-shrink-0 flex items-center justify-between px-4">
        <div class="w-8"></div>
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <h1 class="text-lg font-bold tracking-wide">GastroOS</h1>
        </div>
        <button id="themeToggleBtn" onclick="toggleDarkMode()" class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-800 text-xl">🌙</button>
    </header>

    <div class="flex-1 overflow-y-auto no-scrollbar relative pb-24" id="main-container">
        
        <!-- VISTA 1: CATÁLOGO LECTURA -->
        <main id="view-banco" class="p-4 block">
            <h2 class="text-xl font-bold mb-4">Catálogo de Recetas</h2>
            <div id="dishesList" class="space-y-3 grid grid-cols-1 md:grid-cols-2 md:gap-3 md:space-y-0"></div>
        </main>

        <!-- VISTA 2: STOCK Y PREVISIÓN -->
        <main id="view-stock" class="p-4 hidden space-y-5">
            <section class="glass-card p-4">
                <h2 class="text-base font-bold mb-3">MATERIA PRIMA EN STOCK</h2>
                <div id="rawStockList" class="space-y-2 text-sm text-gray-500">Módulo en construcción...</div>
            </section>
        </main>

        <!-- VISTA 3: GENERADOR DE MENÚ -->
        <main id="view-generator" class="p-4 hidden space-y-4">
            <div class="bg-indigo-900 dark:bg-indigo-950 text-white p-4 rounded-xl shadow-lg text-center">
                <h2 class="text-lg font-bold mb-1">Motor de Planificación</h2>
                <p class="text-[11px] text-indigo-200 mb-3">Aplica reglas cruzadas de ingredientes, técnicas y frecuencias.</p>
                <button onclick="generateMenu()" class="w-full bg-amber-400 hover:bg-amber-500 text-indigo-950 font-black py-3 rounded-xl text-sm shadow-md active:scale-95">
                    🎲 GENERAR MENÚ
                </button>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="dayTabsContainer">
                <button class="day-tab px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white" data-day="Todos">Semana</button>
            </div>
            <div id="generatedMenuContainer" class="space-y-6 md:grid md:grid-cols-2 md:gap-4 md:space-y-0"></div>
        </main>

        <!-- VISTA 4: AJUSTES -->
        <main id="view-settings" class="p-4 hidden space-y-5">
            <section class="glass-card p-4">
                <h3 class="font-bold text-sm mb-3">Histórico y Memoria Inter-Semanal</h3>
                <button onclick="saveWeekToHistory()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold text-sm">Guardar Semana Actual</button>
            </section>
        </main>
    </div>

    <!-- NAVEGACIÓN INFERIOR HIG -->
    <nav class="flex-shrink-0 flex justify-between px-2 items-center fixed bottom-0 left-0 right-0 z-50">
        <button class="nav-btn active flex flex-col items-center justify-center w-1/4 h-full text-indigo-600 dark:text-indigo-400" data-target="view-banco">
            <span class="text-xl mb-0.5">📖</span><span class="text-[9px] font-semibold">RECETARIO</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center w-1/4 h-full text-gray-400" data-target="view-stock">
            <span class="text-xl mb-0.5">📦</span><span class="text-[9px] font-semibold">STOCK</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center w-1/4 h-full text-gray-400" data-target="view-generator">
            <span class="text-xl mb-0.5">⚙️</span><span class="text-[9px] font-semibold">GENERAR</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center w-1/4 h-full text-gray-400" data-target="view-settings">
            <span class="text-xl mb-0.5">⚙️</span><span class="text-[9px] font-semibold">AJUSTES</span>
        </button>
    </nav>

    <script>
        // ESTADO GLOBAL
        let dishes = [];
        let currentMenu = null;
        let previousWeekMenu = JSON.parse(localStorage.getItem('gastro_previousWeek')) || null;
        let isDarkMode = JSON.parse(localStorage.getItem('gastro_dark')) || false;

        function init() {
            // Cargar recetas desde el archivo desacoplado recipes.js
            dishes = (typeof DEFAULT_RECIPES !== 'undefined') ? DEFAULT_RECIPES : [];
            
            const storedMenu = localStorage.getItem('gastro_currentMenu');
            if (storedMenu) currentMenu = JSON.parse(storedMenu);

            applyDarkMode();
            renderDishes();
            renderGeneratorView();

            // Setup Navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.currentTarget.getAttribute('data-target');
                    document.querySelectorAll('main').forEach(m => {
                        m.classList.remove('block');
                        m.classList.add('hidden');
                    });
                    document.getElementById(target).classList.remove('hidden');
                    document.getElementById(target).classList.add('block');

                    document.querySelectorAll('.nav-btn').forEach(b => {
                        b.classList.remove('text-indigo-600', 'dark:text-indigo-400', 'active');
                        b.classList.add('text-gray-400');
                    });
                    e.currentTarget.classList.remove('text-gray-400');
                    e.currentTarget.classList.add('text-indigo-600', 'dark:text-indigo-400', 'active');
                });
            });
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('gastro_dark', isDarkMode);
            applyDarkMode();
        }

        function applyDarkMode() {
            const btn = document.getElementById('themeToggleBtn');
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                btn.innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                btn.innerText = '🌙';
            }
        }

        // RENDER CATÁLOGO LECTURA (Sin botones de edición)
        function renderDishes() {
            const container = document.getElementById('dishesList');
            container.innerHTML = dishes.map(d => `
                <div class="glass-card p-3 flex justify-between items-center">
                    <div>
                        <div class="text-[10px] font-bold text-indigo-600 uppercase mb-0.5">${d.categoria} | ${d.demanda || 'Media'}</div>
                        <div class="text-sm font-bold text-gray-800 dark:text-gray-100">${d.nombre}</div>
                        <div class="text-xs text-gray-500">${d.subcategoria || d.proteina + ' - ' + d.tecnicaCocina}</div>
                    </div>
                </div>
            `).join('');
        }

        // MOTOR ALGORÍTMICO
        function generateMenu() {
            const menu = {};
            const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
            
            // Reglas de Memoria
            let usedVegs = new Set();
            let guisoCount = 0;
            let fritoCount = 0;
            let lastFishSpecies = previousWeekMenu?.["Viernes"]?.segundos?.[2]?.especiePescado || null;

            const firsts = dishes.filter(d => d.categoria === "Primero");
            const meats = dishes.filter(d => d.categoria === "Segundo" && d.proteina === "Carne");
            const fishes = dishes.filter(d => d.categoria === "Segundo" && d.proteina === "Pescado");

            const shuffle = array => array.sort(() => Math.random() - 0.5);

            for (const day of days) {
                // --- PRIMEROS ---
                let availableFirsts = shuffle([...firsts]);
                let selectedFirst1 = availableFirsts.find(d => 
                    (d.subcategoria === "Verduras enteras" || d.subcategoria === "Cremas") && 
                    !usedVegs.has(d.ingredientePrincipal)
                ) || availableFirsts[0];

                if (selectedFirst1?.ingredientePrincipal) usedVegs.add(selectedFirst1.ingredientePrincipal);

                let isFirst1Crema = selectedFirst1?.subcategoria === "Cremas";
                let isFirst1Sopa = selectedFirst1?.subcategoria === "Sopas / caldos";

                let selectedFirst2 = availableFirsts.find(d => {
                    if (d.id === selectedFirst1?.id) return false;
                    let isCrema = d.subcategoria === "Cremas";
                    let isSopa = d.subcategoria === "Sopas / caldos";
                    if ((isFirst1Crema && isSopa) || (isFirst1Sopa && isCrema)) return false; // Incompatibilidad
                    return true;
                }) || availableFirsts.find(d => d.id !== selectedFirst1?.id);

                // --- SEGUNDOS ---
                let availableMeats = shuffle([...meats]);
                let validMeats = availableMeats.filter(d => {
                    if (d.tecnicaCocina === "Guiso / En salsa" && guisoCount >= 2) return false;
                    if (d.tecnicaCocina === "Frito / Rebozado / Empanado" && fritoCount >= 2) return false;
                    return true;
                });

                let selectedMeat1 = validMeats[0] || availableMeats[0];
                if(selectedMeat1?.tecnicaCocina === "Guiso / En salsa") guisoCount++;
                if(selectedMeat1?.tecnicaCocina === "Frito / Rebozado / Empanado") fritoCount++;

                let selectedMeat2 = validMeats.find(d => 
                    d.id !== selectedMeat1?.id && 
                    d.tipoAnimal !== selectedMeat1?.tipoAnimal &&
                    !(d.tecnicaCocina === "Guiso / En salsa" && guisoCount >= 2) &&
                    !(d.tecnicaCocina === "Frito / Rebozado / Empanado" && fritoCount >= 2)
                ) || availableMeats.find(d => d.id !== selectedMeat1?.id);

                if(selectedMeat2?.tecnicaCocina === "Guiso / En salsa") guisoCount++;
                if(selectedMeat2?.tecnicaCocina === "Frito / Rebozado / Empanado") fritoCount++;

                let availableFishes = shuffle([...fishes]);
                let selectedFish = availableFishes.find(d => d.especiePescado !== lastFishSpecies) || availableFishes[0];
                if (selectedFish) lastFishSpecies = selectedFish.especiePescado;

                menu[day] = {
                    primeros: [selectedFirst1, selectedFirst2].filter(Boolean),
                    segundos: [selectedMeat1, selectedMeat2, selectedFish].filter(Boolean)
                };
            }

            currentMenu = menu;
            localStorage.setItem('gastro_currentMenu', JSON.stringify(menu));
            renderGeneratorView();
        }

        function saveWeekToHistory() {
            if(!currentMenu) return;
            previousWeekMenu = currentMenu;
            localStorage.setItem('gastro_previousWeek', JSON.stringify(currentMenu));
            alert("Semana guardada en la memoria inter-semanal.");
        }

        // RENDER MENÚ HIG Apple
        function renderGeneratorView() {
            const container = document.getElementById('generatedMenuContainer');
            container.innerHTML = '';
            if (!currentMenu) return;

            Object.entries(currentMenu).forEach(([day, data]) => {
                let html = `
                <div class="glass-card p-4 space-y-3 mb-4">
                    <h3 class="font-bold text-lg text-indigo-700 dark:text-indigo-400 mb-2 border-b border-indigo-100 dark:border-indigo-900 pb-2">${day}</h3>
                    
                    <div class="space-y-2">
                        <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Primeros Platos</div>`;
                
                data.primeros.forEach(p => {
                    html += `
                        <div class="gastro-slot flex items-center p-3">
                            <div>
                                <p class="text-xs font-bold text-gray-800 dark:text-gray-200">${p.nombre}</p>
                                <p class="text-[10px] text-gray-500">${p.subcategoria}</p>
                            </div>
                        </div>`;
                });

                html += `</div><div class="space-y-2 mt-4">
                         <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Segundos Platos</div>`;

                const sgLabels = ['2º Carne (Opción 1)', '2º Carne (Opción 2)', '2º Pescado'];
                data.segundos.forEach((p, idx) => {
                    html += `
                        <div class="gastro-slot flex items-center p-3">
                            <div>
                                <p class="text-[10px] text-indigo-600 dark:text-indigo-400 font-bold uppercase mb-0.5">${sgLabels[idx]}</p>
                                <p class="text-xs font-bold text-gray-800 dark:text-gray-200">${p.nombre}</p>
                                <p class="text-[10px] text-gray-500">${(p.tipoAnimal || p.especiePescado)} · ${p.tecnicaCocina}</p>
                            </div>
                        </div>`;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        window.onload = init;
    </script>
</body>
</html>
